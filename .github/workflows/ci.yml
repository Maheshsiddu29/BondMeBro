name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch — saves minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NO WORKFLOW-WIDE `FOUNDRY_PROFILE`. It used to be set to `ci` here, which applied the deep
# profile to EVERY job -- including the gas job, whose committed snapshot is generated under the
# default profile. `forge snapshot --check` then compared fuzz 5000 / invariant 512x100 figures
# against 256 / 64x32 ones and diffed on essentially every fuzz and invariant entry.
#
# The deep profile is now scoped to the single command that wants it: the deep invariant run in
# the `test` job below.

jobs:
  lint:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Fails if anyone committed unformatted code. Run `forge fmt` locally to fix.
      - name: Check formatting
        run: forge fmt --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      # Cache the compiled output so test/coverage jobs don't recompile from scratch.
      - name: Cache build
        uses: actions/cache/save@v4
        with:
          path: |
            out
            cache
          key: build-${{ github.sha }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Restore build
        uses: actions/cache/restore@v4
        with:
          path: |
            out
            cache
          key: build-${{ github.sha }}

      # STEP B -- the optimized production suite, under the DEFAULT release profile.
      # This includes `test_adversarial_victimCallbackStaysInsideTheCeiling`; no gas assertion is
      # skipped here.
      - name: Run tests (default profile)
        run: forge test -vvv

      # STEP C -- the invariant suite at the default profile's depth.
      - name: Run invariants (default profile)
        run: forge test --match-path 'test/invariant/*' -vv

      # STEP D -- the deep campaign. The ONLY command that gets the ci profile, and it is scoped to
      # this command rather than exported to the job.
      - name: Run invariants (deep, ci profile)
        run: FOUNDRY_PROFILE=ci forge test --match-path 'test/invariant/*' -vv

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Runs the SAME test set as the optimized job -- no test is excluded from coverage any more.
      # The gas-ceiling assertion measures a callback frame rather than a whole swap, so it is
      # valid unoptimized too.
      - name: Run coverage
        run: |
          make coverage | tee coverage.txt

      # Surface the table directly in the PR page — reviewers shouldn't dig through logs.
      - name: Publish coverage summary
        run: |
          echo '### Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  gas:
    name: Gas snapshot
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Fails if gas costs moved without the committed snapshot being updated.
      # This is what turns "we optimised the hook" into a reviewable diff.
      #
      # Runs the SHARED Makefile target so the exclusion set cannot drift between local and CI, and
      # under the DEFAULT profile so the comparison is like for like. No `--tolerance`: the tracked
      # entries are deterministic, so any difference is a real one worth looking at.
      - name: Check gas snapshot
        run: make snapshot-check
